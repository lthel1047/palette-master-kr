name: Staging (dev → saekgam.cc/staging)

on:
  push:
    branches: [dev]

permissions:
  contents: read
  actions: write

jobs:
  test-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.js
      - run: node --test worker/test/*.test.mjs
      - name: 사이트 배포 실행 (main 기준으로 main+dev 를 함께 묶음)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R ${{ github.repository }}
