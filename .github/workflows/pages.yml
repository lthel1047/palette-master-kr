name: Deploy to GitHub Pages

# main → 실제 사이트 https://saekgam.cc
# dev  → 테스트 사이트 https://saekgam.cc/staging/ (테스트 API·광고 없음)
# 어느 쪽에 푸시해도 두 브랜치를 함께 묶어서 한 번에 배포한다.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.js
      - run: node --test worker/test/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (실제 사이트)
        uses: actions/checkout@v4
        with:
          ref: main
          path: src-main
      - name: Checkout dev (테스트 사이트)
        id: dev
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: dev
          path: src-dev
      - name: Build
        run: |
          python3 src-main/scripts/build_site.py src-main _site "$(git -C src-main rev-parse --short HEAD)"
          if [ -d src-dev/.git ]; then
            python3 src-dev/scripts/build_site.py src-dev _site/staging "$(git -C src-dev rev-parse --short HEAD)" --staging
          fi
          grep -o 'v=[0-9a-f]*' _site/index.html | head -1
          ls _site _site/staging 2>/dev/null | head -40
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
