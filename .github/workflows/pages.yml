name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.js
      - run: node --test worker/test/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js ads-config.js favicon.svg og.png _site/
          if [ -f ads.txt ]; then cp ads.txt _site/; fi
          # 배포할 때마다 JS/CSS 주소에 버전을 붙여서, 브라우저가 새 화면과 옛 코드를 섞어 쓰지 않게 한다
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(src|href)=\"((js/[^\"]+\.js)|ads-config\.js|css/[^\"]+\.css)\"#\1=\"\2?v=$V\"#g" _site/index.html
          grep -E "\?v=" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
