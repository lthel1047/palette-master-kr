name = "saekgam-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

# api.saekgam.cc 로 연결 (saekgam.cc 가 같은 Cloudflare 계정에 있어야 함)
# TOML 규칙상 [[표]] 보다 위에 있어야 최상위 설정으로 읽힌다
routes = [
  { pattern = "api.saekgam.cc", custom_domain = true },
]

# 랭킹 저장용 D1
[[d1_databases]]
binding = "DB"
database_name = "saekgam-ranking"
database_id = "6c154d22-2305-4e15-8fc0-7ffb00ed885b"

# ---------- 테스트 서버 (dev 브랜치) ----------
# npx wrangler deploy --env staging  →  api-staging.saekgam.cc, 테스트 전용 DB
[env.staging]
name = "saekgam-api-staging"
routes = [
  { pattern = "api-staging.saekgam.cc", custom_domain = true },
]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "saekgam-ranking-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"
